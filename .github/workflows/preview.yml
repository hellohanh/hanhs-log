# Every pull request gets its own preview at
# https://hellohanh.github.io/hanhs-log/pr-preview/pr-<number>/
# and a comment on the PR with the link. Closing or merging the PR removes it.
name: Pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - name: Check the settings are present (names only, never values)
        if: github.event.action != 'closed'
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          C: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          D: ${{ secrets.VITE_GOOGLE_MAP_ID }}
        run: |
          {
            echo '### Build settings'
            for pair in "VITE_SUPABASE_URL:$A" "VITE_SUPABASE_ANON_KEY:$B" "VITE_GOOGLE_MAPS_API_KEY:$C" "VITE_GOOGLE_MAP_ID:$D"; do
              name="${pair%%:*}"; value="${pair#*:}"
              if [ -n "$value" ]; then echo "- $name: set ✅"; else echo "- $name: **missing** ❌"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Connection check (read-only; reports facts, never secret values)
        if: github.event.action != 'closed'
        continue-on-error: true
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DB: ${{ secrets.SUPABASE_DB_URL }}
          MAPSKEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          MAPID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
        run: |
          url="${A%/}"; url="${url%/rest/v1}"
          ref=$(printf '%s' "$url" | sed -E 's#^https?://([^.]+)\.supabase\.co.*#\1#')
          echo "::notice title=Website project::The website points at Supabase project $ref"
          code=$(curl -s -o settings.json -w '%{http_code}' "$url/auth/v1/settings" -H "apikey: $B")
          if [ "$code" = "200" ]; then
            email=$(jq -r '.external.email' settings.json); anon=$(jq -r '.external.anonymous_users' settings.json)
            echo "::notice title=Sign-in::Key works. Email sign-in: $email. Anonymous sign-ins (guests by link): $anon"
          else
            echo "::warning title=Sign-in::The anon key was refused (HTTP $code). Check VITE_SUPABASE_ANON_KEY belongs to project $ref"
          fi
          dbref=$(printf '%s' "$DB" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          if [ "$dbref" = "$ref" ]; then echo "::notice title=Database secret::SUPABASE_DB_URL is for the same project ($ref)"
          else echo "::warning title=Database secret::SUPABASE_DB_URL is for project '${dbref:-unknown}', not $ref"; fi
          # Hanh's Log's own project has run 0001_hanhs_log_foundation; the old
          # Wanderlog database never did (it has itinerary_days, but so does
          # Hanh's Log since 0002, so that alone can't tell them apart).
          if has=$(psql "$DB" -X -t -A -c "select to_regclass('hanhs_log_meta.applied_migrations') is not null" 2>&1); then
            mig=-
            if [ "$has" = "t" ]; then
              mig=$(psql "$DB" -X -t -A -c "select case when bool_or(filename = '0001_hanhs_log_foundation.sql') then string_agg(left(filename, 4), ' ' order by filename) else '-' end from hanhs_log_meta.applied_migrations")
            fi
            if [ "${mig:--}" = "-" ]; then echo "::warning title=Database::Connected, but this is not Hanh's Log's database (no 0001_hanhs_log_foundation). It may be the OLD Wanderlog database"
            else echo "::notice title=Database::Connected to Hanh's Log's database. Migrations applied: $mig"; fi
          else
            echo "::warning title=Database::Could not connect with SUPABASE_DB_URL (check the password and that it's the Session pooler URI)"
          fi
          # Tilt and rotate work only on Google's own looks, and only on the
          # vector map, which the app builds only when a Map ID is present. A
          # missing Map ID greys tilt/rotate out on every look (standard,
          # terrain, satellite included). CI can tell set from missing and
          # that the key is accepted; it can't confirm the Map ID is a *vector*
          # map in the key's project — that part is checked by eye on the map.
          if [ -z "$MAPID" ]; then
            echo "::warning title=Map::VITE_GOOGLE_MAP_ID is missing, so tilt and rotate are greyed out on every look. Add it in Settings → Secrets (a Vector Map ID)."
          elif [ -z "$MAPSKEY" ]; then
            echo "::warning title=Map::VITE_GOOGLE_MAPS_API_KEY is missing, so the map (and tilt) can't load."
          else
            # Does Google accept this key for the Maps JS API? (A referrer-restricted
            # key can still pass this unreferred check; a dead or wrong key won't.)
            mapcode=$(curl -s -o /dev/null -w '%{http_code}' "https://maps.googleapis.com/maps/api/js?key=$MAPSKEY")
            if [ "$mapcode" = "200" ]; then
              echo "::notice title=Map::Map ID is set and the Maps key is accepted. Tilt also needs the Map ID to be a Vector map in the same Google Cloud project as the key."
            else
              echo "::warning title=Map::Map ID is set, but the Maps key was refused (HTTP $mapcode). The map and tilt won't load until the key is fixed."
            fi
          fi
          rm -f settings.json
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /hanhs-log/pr-preview/pr-${{ github.event.number }}/
          # Supabase project address and public (anon) key, from GitHub
          # Settings → Secrets. Both are safe in a web page: the database's
          # access rules decide what each signed-in person can see.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Google Maps key and Map ID (Wanderlog's), from GitHub Secrets. The
          # key is locked to hellohanh.github.io in Google Cloud, so it is safe
          # in a web page.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: true
