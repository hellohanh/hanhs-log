# Runs on every pull request. All of these must pass before merging:
#  - the app builds and every migration follows the rules (docs/database.md)
#  - security tests: owner / stranger / invited guest / signed-out visitor,
#    against a throwaway copy of the live rules (tests/db)
#  - browser tests at phone, laptop and 150% zoom, with screenshots (tests/browser)
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Migration rules
        run: |
          # Migrations this PR modified or deleted (adding new ones is fine).
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations | tr '\n' ' ')
          node scripts/check-migrations.mjs --changed="$changed"

  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pg17
      - name: Owner, stranger, guest and visitor checks
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          tests/db/run.sh | tee security-tests.txt
          { echo '### Security tests'; echo '```'; cat security-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build for local serving
        run: npm run build
        env:
          BASE_PATH: /
      - name: Phone, laptop and 150% zoom
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screens/
          retention-days: 14
          if-no-files-found: ignore
