# Merging into main publishes the live site to the gh-pages branch.
# clean-exclude keeps open pull-request previews (pr-preview/) from being
# wiped by a main deploy.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the settings are present (names only, never values)
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          C: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          D: ${{ secrets.VITE_GOOGLE_MAP_ID }}
        run: |
          {
            echo '### Build settings'
            for pair in "VITE_SUPABASE_URL:$A" "VITE_SUPABASE_ANON_KEY:$B" "VITE_GOOGLE_MAPS_API_KEY:$C" "VITE_GOOGLE_MAP_ID:$D"; do
              name="${pair%%:*}"; value="${pair#*:}"
              if [ -n "$value" ]; then echo "- $name: set ✅"; else echo "- $name: **missing** ❌"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # An annotation (not just the summary) so a greyed-out tilt is easy to
          # trace: tilt/rotate need a Vector Map ID; without one they grey out
          # on every look (standard, terrain, satellite included).
          if [ -z "$D" ]; then
            echo "::warning title=Map::VITE_GOOGLE_MAP_ID is missing — this live build has no vector map, so tilt and rotate are greyed out everywhere. Add it in Settings → Secrets and re-run Deploy."
          elif [ -z "$C" ]; then
            echo "::warning title=Map::VITE_GOOGLE_MAPS_API_KEY is missing — the map won't load."
          else
            echo "::notice title=Map::Map ID and Maps key are both set in this build. If tilt is still greyed, the Map ID isn't a Vector map, or it's in a different Google Cloud project than the key."
          fi
      - run: npm run build
        env:
          BASE_PATH: /hanhs-log/
          # Supabase project address and public (anon) key, from GitHub
          # Settings → Secrets. Both are safe in a web page: the database's
          # access rules decide what each signed-in person can see.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Google Maps key and Map ID (Wanderlog's), from GitHub Secrets. The
          # key is locked to hellohanh.github.io in Google Cloud, so it is safe
          # in a web page.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
