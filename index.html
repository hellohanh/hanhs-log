    <script>
      // Apply a saved light/dark choice before first paint (no flash).
      try {
        var t = localStorage.getItem('hanhs-log-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      // Deep-link restore: public/404.html sends /hanhs-log/wander here as
      // /hanhs-log/?/wander; put the real path back before the app starts
      // (GitHub Pages only serves real files — Wanderlog L14).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
